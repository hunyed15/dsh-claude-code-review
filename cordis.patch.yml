- insert:
    - id: claude-code-review
      name: '@local/claude-code-review'
      config:
        # 审核引擎：留空自动探测 <cwd>/tools/claude-review/Invoke-ClaudeReview.ps1，
        # 找不到时使用插件自带的 scripts/Invoke-ClaudeReview.ps1
        enginePath: ''
        # 单次审核超时（秒），会作为 -TimeoutSec 传给引擎，并决定工具级超时（引擎超时 + 120s 余量）。
        timeoutSec: 1500
        # 是否允许在别的仓库里回退到插件自带的引擎副本
        allowBundledFallback: true
        # 面板接口是否允许客户端自报 cwd（默认 false：只允许与会话自身项目一致的路径）
        allowPanelCwd: false
        # 会话解析失败时是否回退到宿主默认工作区（默认 false：宁可报错也不跨项目读）
        fallbackToDefaultWorkspace: false
        # 面板路由冷启动重试：webServer 可能晚于插件就绪
        panelRetryAttempts: 10
        panelRetryMs: 500
        # 看门狗：这么久仍未注册成功就记一条告警（claude_review 工具不受影响）
        panelWatchdogMs: 15000
